<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="POUNCE - Physics-Based Cat Puzzle Game" />
    <meta property="og:description" content="Launch cats at enemies in this physics-based puzzle game!" />
    <meta property="og:type" content="website" />
    <meta name="description" content="POUNCE - A physics-based cat puzzle game. Launch cats at mice, pigeons, dogs, and squirrels!" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="keywords" content="HTML, CSS, JavaScript, matter.js, pounce, cat, game, puzzle" />
    <title>POUNCE - Physics-Based Cat Puzzle Game</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <!-- HUD -->
    <div id="hud">
      <div id="hud-left">
        <div id="lives-display">
          <span class="hud-label">LIVES</span>
          <span id="lives-icons">❤️❤️❤️❤️❤️</span>
        </div>
        <div id="level-display">
          <span class="hud-label">LEVEL</span>
          <span id="level-num">1</span>
        </div>
      </div>
      <div id="hud-center">
        <h1 id="game-title">🐱 POUNCE</h1>
      </div>
      <div id="hud-right">
        <div id="gems-display">
          <span class="hud-label">💎 GEMS</span>
          <span id="gems-count">50</span>
        </div>
        <div id="score-display">
          <span class="hud-label">SCORE</span>
          <span id="score-count">0</span>
        </div>
      </div>
    </div>

    <!-- Cat Selector -->
    <div id="cat-selector">
      <span class="hud-label">CAT TYPE:</span>
      <button class="cat-btn active" data-cat="orange" title="Balanced cat. Good all-around.">🟠 Orange</button>
      <button class="cat-btn" data-cat="chonky" title="Heavy hitter. Slow but powerful.">🔶 Chonky</button>
      <button class="cat-btn" data-cat="ninja" title="Fast &amp; light. Bounces everywhere.">🟫 Ninja</button>
      <button class="cat-btn" data-cat="sleepy" title="Unpredictable. Extra bounce.">🩷 Sleepy</button>
      <span id="cats-left-display" class="hud-label">CATS: <span id="cats-left">5</span></span>
    </div>

    <!-- Active Booster -->
    <div id="booster-bar">
      <span class="hud-label">BOOSTER:</span>
      <button class="booster-btn" data-booster="meteorShower" id="btn-meteorShower">☄️ Meteor <span id="cnt-meteorShower">0</span></button>
      <button class="booster-btn" data-booster="superStrength" id="btn-superStrength">💪 Strength <span id="cnt-superStrength">0</span></button>
      <button class="booster-btn" data-booster="slowMotion" id="btn-slowMotion">🐌 Slow <span id="cnt-slowMotion">0</span></button>
      <button class="booster-btn" data-booster="catSwarm" id="btn-catSwarm">🐱 Swarm <span id="cnt-catSwarm">0</span></button>
    </div>

    <!-- Game Canvas Area -->
    <div id="game-container"></div>

    <!-- Overlay Screens -->
    <div id="screen-overlay" class="hidden">
      <div id="screen-box">
        <h2 id="screen-title"></h2>
        <p id="screen-body"></p>
        <div id="screen-buttons"></div>
      </div>
    </div>

    <!-- Daily Bonus Popup -->
    <div id="daily-bonus-popup" class="hidden">
      <div id="daily-bonus-box">
        <h2>🎁 Daily Bonus!</h2>
        <p id="daily-bonus-text"></p>
        <button id="daily-bonus-ok">Claim!</button>
      </div>
    </div>

    <!-- Scripts: data files first, then engine, then game -->
    <script src="data/game-config.js"></script>
    <script src="data/cats.js"></script>
    <script src="data/enemies.js"></script>
    <script src="data/levels.js"></script>
    <script src="data/monetization.js"></script>
    <script src="matter.js"></script>
    <script src="script.js"></script>
  </body>
</html>
